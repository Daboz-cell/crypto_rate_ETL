

services:
  postgres:
    image: postgres:16
    container_name: crypto_rate_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - crypto_pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: crypto_rate_app
    depends_on:
      - postgres
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: postgres
      DB_PORT: 5432

volumes:
  crypto_pgdata: