
services:
  postgres:
    image: postgres:16
    container_name: crypto_rate_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - crypto_pgdata:/var/lib/postgresql/data

volumes:
  crypto_pgdata: